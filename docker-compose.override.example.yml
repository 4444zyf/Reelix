# Optional additions to docker-compose.yml. Copy to docker-compose.override.yml (compose reads it by itself)
# and keep the parts you need.

services:
  reelix:
    # Join the network of services you already run (another compose project, a VPN container such as
    # gluetun), so Reelix can call them by container name: QBITTORRENT_URL=http://gluetun:8080
    networks: [reelix, existing]

  # magpie for other machines' agents too: publish the gateway and list their addresses in
  # MAGPIE_ALLOW_IPS_EXTRA. Each needs a gateway key of its own.
  # magpie:
  #   ports:
  #     - "3425:3425"

networks:
  existing:
    name: your-other-project_default   # `docker network ls` shows the names
    external: true
